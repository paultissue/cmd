<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>ðŸ¤–</text></svg>">
<title>ðŸ¤– ${pageName} for !cmd</title>
<script>
  const safeStorage = {
    get: (k, fallback) => { try { return localStorage.getItem(k) ?? fallback; } catch { return fallback; } },
    set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
  };
  const theme = safeStorage.get('theme_preference', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', theme);
  const showAliases = ${isSimpleRoute} ? true : safeStorage.get('show_aliases', 'true') !== 'false';
  document.write('<style>body { visibility: hidden; }</style>');
  window.addEventListener('DOMContentLoaded', () => {
    document.body.className = showAliases ? 'show-aliases' : 'hide-aliases';
    document.body.style.visibility = 'visible';
  });
</script>
<style>${cssStyles}</style>
</head>
<body>
<div class="sticky-header" id="stickyHeader">
  <div class="header-container">
    <h2>ðŸ¤– ${pageName} for !cmd</h2>
    <div class="header-right" id="headerRight">
      <span class="timestamp">Last Refreshed: ${dateStr}</span>
      ${!isSimpleRoute ? '<button class="btn active" id="btnAliases" data-action="aliases">ðŸ·ï¸ Aliases: Show</button>' : ''}
      <button class="btn active" id="btnTable" data-action="table">${!isSimpleRoute ? 'ðŸ“‹ Table: Expanded' : 'ðŸ“‹ Table'}</button>
      <button class="btn" id="btnJson" data-action="json">ðŸ“¦ JSON</button>
      <button class="btn" id="btnRaw" data-action="raw">ðŸ“„ Raw</button>

      <div class="theme-split-container">
        <button class="theme-main-btn" id="btnThemeCycle" data-action="cycle-theme">ðŸŒ“ Theme</button>
        <button class="theme-arrow-btn" id="btnThemeMenu" data-action="toggle-theme-menu">â–¼</button>
        <div class="theme-menu" id="themeMenu">
          <button class="theme-item" data-theme-val="light">â˜€ï¸ Light</button>
          <button class="theme-item" data-theme-val="dark">ðŸŒ™ Dark</button>
          <button class="theme-item" data-theme-val="sepia">ðŸ“œ Sepia</button>
          <button class="theme-item" data-theme-val="midnight">ðŸŒŒ Midnight</button>
          <button class="theme-item" data-theme-val="solarized">ðŸŽ¨ Solarized</button>
          <button class="theme-item" data-theme-val="soft-blue">ðŸ’§ Soft Blue</button>
          <button class="theme-item" data-theme-val="nord">â„ï¸ Nord</button>
          <button class="theme-item" data-theme-val="dracula">ðŸ§› Dracula</button>
          <button class="theme-item" data-theme-val="gruvbox">ðŸªµ Gruvbox</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="panelTable" class="view-panel active">
  <div class="table-container">
    <table id="mainTable">
      <thead id="cloneHead" class="fixed-lock"></thead>
      <thead id="originalHead">
        <tr><th>${col1}</th>${col2 ? `<th class="col-aliases">${col2}</th>` : ""}${col3 ? `<th>${col3}</th>` : ""}</tr>
      </thead>
      <tbody id="tableBody">
        ${processedTableRowsHtml}
      </tbody>
    </table>
  </div>
</div>
<div id="panelJson" class="view-panel"><pre id="jsonPre"></pre></div>
<div id="panelRaw" class="view-panel"><pre id="rawPre"></pre></div>

<script>
let elHeader, elOriginalHead, elCloneHead, elMainTable, elPanelTable, elBtnAliases, elBtnTable, elThemeMenu;

const initElements = () => {
  elHeader ||= document.getElementById('stickyHeader');
  elOriginalHead ||= document.getElementById('originalHead');
  elCloneHead ||= document.getElementById('cloneHead');
  elMainTable ||= document.getElementById('mainTable');
  elPanelTable ||= document.getElementById('panelTable');
  elBtnAliases ||= document.getElementById('btnAliases');
  elBtnTable ||= document.getElementById('btnTable');
  elThemeMenu ||= document.getElementById('themeMenu');
};

const boldAndItalicizeArguments = (text) => {
  if (!text) return '';
  return text.replace(/\\$\\([^)]+\\)/g, '<strong><em>$&</em></strong>');
};

const updateZebraStriping = () => {
  const rows = document.querySelectorAll('#tableBody tr');
  let dataIndex = 0;
  rows.forEach(tr => {
    if (tr.hasAttribute('style') && tr.getAttribute('style').includes('background')) {
      tr.classList.remove('row-even', 'row-odd');
    } else {
      tr.classList.toggle('row-even', dataIndex % 2 === 0);
      tr.classList.toggle('row-odd', dataIndex % 2 !== 0);
      dataIndex++;
    }
  });
};

const renderRawText = (elementId, text) => {
  const preEl = document.getElementById(elementId);
  if (!preEl) return;

  if (!text) {
    preEl.innerHTML = '';
    return;
  }

  const escaped = text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
  preEl.innerHTML = escaped;
};

const processJsonAlternation = (elementId, text) => {
  const preEl = document.getElementById(elementId);
  if (!preEl) return;

  if (!text) {
    preEl.innerHTML = '';
    return;
  }

  const lines = text.split('\\n');
  let blocks = [];
  let currentBlock = [];

  lines.forEach(line => {
    const isTopLevelKey = /^\\s{2}"[^"]+"\\s*:\\s*\\{/.test(line);
    if (isTopLevelKey && currentBlock.length > 0) {
      blocks.push(currentBlock);
      currentBlock = [line];
    } else {
      currentBlock.push(line);
    }
  });
  if (currentBlock.length > 0) {
    blocks.push(currentBlock);
  }

  let html = '';
  let dataBlockIndex = 0;

  blocks.forEach(block => {
    const blockText = block.join('\\n');
    const escaped = blockText
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');

    const trimmed = blockText.trim();
    const isWrapperOrHeader = trimmed === '{' || trimmed === '}' || trimmed.startsWith('//') || trimmed.startsWith('#');

    if (isWrapperOrHeader) {
      html += '<span class="pre-block" style="padding: 4px 12px;">' + escaped + '</span>';
    } else {
      const cls = dataBlockIndex % 2 === 0 ? 'alt-block-even' : 'alt-block-odd';
      html += '<span class="pre-block ' + cls + '">' + escaped + '</span>';
      dataBlockIndex++;
    }
  });

  preEl.innerHTML = html;
};

const syncHeaderLock = () => {
  initElements();
  if (!elHeader || elPanelTable?.style.display === 'none') {
    if (elCloneHead) elCloneHead.style.display = 'none';
    return;
  }

  const headerBottom = elHeader?.getBoundingClientRect().bottom || 0;
  const tableRect = elMainTable?.getBoundingClientRect();

  if (tableRect && tableRect.top <= headerBottom && tableRect.bottom > headerBottom) {
    if (elCloneHead && elCloneHead.style.display !== 'block') {
      elCloneHead.innerHTML = elOriginalHead?.innerHTML || '';
      const origThs = elOriginalHead?.querySelectorAll('th') || [];
      const cloneThs = elCloneHead?.querySelectorAll('th') || [];
      origThs.forEach((th, i) => {
        if (cloneThs[i]) cloneThs[i].style.width = th.getBoundingClientRect().width + 'px';
      });
      elCloneHead.style.display = 'block';
    }
    if (elCloneHead) {
      elCloneHead.style.top = headerBottom + 'px';
      elCloneHead.style.left = tableRect.left + 'px';
      elCloneHead.style.width = tableRect.width + 'px';
    }
  } else {
    if (elCloneHead) elCloneHead.style.display = 'none';
  }
};

const setTheme = (themeName) => {
  document.documentElement.setAttribute('data-theme', themeName);
  safeStorage.set('theme_preference', themeName);

  document.querySelectorAll('.theme-item').forEach(item => {
    item.classList.toggle('active', item.getAttribute('data-theme-val') === themeName);
  });

  if (elThemeMenu) elThemeMenu.classList.remove('open');
  setTimeout(syncHeaderLock, 0);
};

const cycleTheme = () => {
  const themes = ['light', 'dark', 'sepia', 'midnight', 'solarized', 'soft-blue', 'nord', 'dracula', 'gruvbox'];
  const current = document.documentElement.getAttribute('data-theme') || 'light';
  const nextIndex = (themes.indexOf(current) + 1) % themes.length;
  setTheme(themes[nextIndex]);
};

const toggleThemeMenu = () => {
  initElements();
  elThemeMenu?.classList.toggle('open');
};

${!isSimpleRoute ? `
const toggleAliases = () => {
  if (safeStorage.get('preferred_view', 'table') !== 'table') {
    switchView('table');
    return;
  }

  const show = document.body.classList.toggle('show-aliases');
  document.body.classList.toggle('hide-aliases', !show);
  safeStorage.set('show_aliases', show);

  if (elBtnAliases) {
    elBtnAliases.textContent = 'ðŸ·ï¸ Aliases: ' + (show ? 'Show' : 'Hide');
    elBtnAliases.classList.toggle('active', show);
  }

  document.querySelectorAll('tr[style*="background"] td').forEach(td => td.setAttribute('colspan', show ? '3' : '2'));
  if (elCloneHead) elCloneHead.style.display = 'none';
  setTimeout(syncHeaderLock, 0);
};

const updateTableUI = (expanded) => {
  if (elBtnTable) elBtnTable.textContent = 'ðŸ“‹ Table: ' + (expanded ? 'Expanded' : 'Simple');
  document.querySelectorAll('#panelTable tbody tr[data-expanded]').forEach(tr => {
    const rawVal = tr.getAttribute(expanded ? 'data-expanded' : 'data-short');
    tr.lastElementChild.innerHTML = boldAndItalicizeArguments(rawVal);
  });
  updateZebraStriping();
  if (elCloneHead) elCloneHead.style.display = 'none';
  setTimeout(syncHeaderLock, 0);
};

const handleTableBtn = () => {
  if (safeStorage.get('preferred_view', 'table') === 'table') {
    const next = safeStorage.get('expanded_view', 'true') !== 'false';
    const toggled = !next;
    safeStorage.set('expanded_view', toggled);
    updateTableUI(toggled);
  } else {
    switchView('table');
  }
};
` : `
const updateTableUI = () => {
  document.querySelectorAll('#panelTable tbody tr').forEach(tr => {
    const cell = tr.lastElementChild;
    if (cell && !tr.hasAttribute('style')) {
      cell.innerHTML = boldAndItalicizeArguments(cell.innerHTML);
    }
  });
};
const handleTableBtn = () => switchView("table");
`}

const switchView = (v) => {
  ['table', 'json', 'raw'].forEach(name => {
    const capitalized = name.charAt(0).toUpperCase() + name.slice(1);
    document.getElementById('panel' + capitalized)?.classList.toggle('active', name === v);
    document.getElementById('btn' + capitalized)?.classList.toggle('active', name === v);
  });

  if (v === 'table') {
    ${!isSimpleRoute ? `
    updateTableUI(safeStorage.get('expanded_view', 'true') !== 'false');
    ` : `
    updateTableUI();
    updateZebraStriping();
    `}
  } else {
    updateZebraStriping();
  }
  safeStorage.set('preferred_view', v);
  setTimeout(syncHeaderLock, 0);
};

window.addEventListener('DOMContentLoaded', () => {
  initElements();

  document.querySelectorAll('#panelTable tbody tr[data-expanded]').forEach(tr => {
    tr.setAttribute('data-expanded', boldAndItalicizeArguments(tr.getAttribute('data-expanded')));
    tr.setAttribute('data-short', boldAndItalicizeArguments(tr.getAttribute('data-short')));
  });

  updateZebraStriping();
  processJsonAlternation('jsonPre', ${JSON.stringify(jsonFormattedText)});
  renderRawText('rawPre', ${JSON.stringify(rawText)});

  let resizeTimer;
  window.addEventListener('scroll', syncHeaderLock, { passive: true });
  window.addEventListener('resize', () => {
    if (elCloneHead) elCloneHead.style.display = 'none';
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(syncHeaderLock, 50);
  }, { passive: true });

  window.addEventListener('click', (e) => {
    if (!e.target.closest('.theme-split-container')) {
      elThemeMenu?.classList.remove('open');
    }
  });

  document.getElementById('headerRight')?.addEventListener('click', (e) => {
    const actionTarget = e.target.closest('[data-action]');
    const themeValTarget = e.target.closest('[data-theme-val]');

    if (themeValTarget) {
      setTheme(themeValTarget.getAttribute('data-theme-val'));
      return;
    }

    const action = actionTarget?.getAttribute('data-action');
    if (!action) return;

    if (action === 'aliases') toggleAliases();
    else if (action === 'table') handleTableBtn();
    else if (action === 'json') switchView('json');
    else if (action === 'raw') switchView('raw');
    else if (action === 'cycle-theme') cycleTheme();
    else if (action === 'toggle-theme-menu') toggleThemeMenu();
  });

  const currentTheme = document.documentElement.getAttribute('data-theme') || 'light';
  document.querySelectorAll('.theme-item').forEach(item => {
    item.classList.toggle('active', item.getAttribute('data-theme-val') === currentTheme);
  });

  if (!${isSimpleRoute}) {
    const show = safeStorage.get('show_aliases', 'true') !== 'false';
    if (elBtnAliases) {
      elBtnAliases.textContent = 'ðŸ·ï¸ Aliases: ' + (show ? 'Show' : 'Hide');
      elBtnAliases.classList.toggle('active', show);
    }
    updateTableUI(safeStorage.get('expanded_view', 'true') !== 'false');
  }
  switchView(safeStorage.get('preferred_view', 'table'));
});
</script>
<style>
  tbody tr.row-even td { background-color: var(--row-bg-1) !important; }
  tbody tr.row-odd td { background-color: var(--row-bg-2) !important; }
</style>
</body>
</html>
