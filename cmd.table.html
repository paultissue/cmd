<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
<title>🤖 ${pageName} for !cmd</title>
<script>
  // Apply theme and alias preferences immediately before first paint to prevent flashes
  const savedTheme = localStorage.getItem('theme_preference');
  if (savedTheme) {
    document.documentElement.setAttribute('data-theme', savedTheme);
  } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  let initialAliasClass = 'show-aliases';
  if (!${isSimpleRoute}) {
    const savedShowAliases = localStorage.getItem('show_aliases');
    if (savedShowAliases === 'false') {
      initialAliasClass = 'hide-aliases';
    }
  }
  document.write('<style>body { visibility: hidden; }</style>');
  window.addEventListener('DOMContentLoaded', () => {
    document.body.className = initialAliasClass;
    document.body.style.visibility = 'visible';
  });
</script>
<style>
:root {
  --bg-color: #ffffff;
  --text-color: #000000;
  --header-bg: #f2f2f2;
  --border-color: #ccc;
  --comment-bg: #e9ecef;
  --comment-text: #495057;
  --timestamp-color: #666;
  --link-color: #0056b3;
}
[data-theme="dark"] {
  --bg-color: #1a1a1a;
  --text-color: #e0e0e0;
  --header-bg: #2d2d2d;
  --border-color: #404040;
  --comment-bg: #252525;
  --comment-text: #adb5bd;
  --timestamp-color: #aaa;
  --link-color: #4dabf7;
}
body { font-family: Arial, sans-serif; padding: 0 20px 20px 20px; background-color: var(--bg-color); color: var(--text-color); margin: 0; }
a { color: var(--link-color); text-decoration: none; }
a:hover { text-decoration: underline; }

.sticky-header {
  position: sticky;
  top: 0;
  background-color: var(--bg-color);
  padding: 20px 0 15px 0;
  margin-bottom: 0;
  z-index: 1000;
}

.header-container { display: flex; justify-content: space-between; align-items: baseline; max-width: ${maxWidth}; flex-wrap: wrap; gap: 10px; }
h2 { margin: 0; font-size: 1.5rem; }
.header-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.timestamp { color: var(--timestamp-color); font-size: 0.85em; font-weight: normal; margin-right: 5px; }
.btn { background: none; border: 1px solid var(--border-color); color: var(--text-color); padding: 0 12px; height: 31px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 4px; font-size: 0.85em; text-align: center; box-sizing: border-box; vertical-align: middle; white-space: nowrap; }
.btn:hover { background: var(--header-bg); }
.btn.active { background: var(--header-bg); font-weight: bold; border-color: var(--text-color); }
${!isSimpleRoute ? '#btnTable { width: 145px; } #btnAliases { width: 135px; }' : ''}
table { 
  border-collapse: collapse; 
  width: 100%; 
  max-width: ${maxWidth}; 
  word-break: break-word; 
  table-layout: auto; 
}
th, td { 
  border: 1px solid var(--border-color); 
  padding: 8px 12px; 
  text-align: left; 
  font-size: 0.95rem; 
}
th:nth-child(1), td:nth-child(1) { 
  width: 1%; 
  white-space: nowrap; 
}
th.col-aliases, td.col-aliases { width: 15%; max-width: none; white-space: normal; overflow: visible; text-overflow: clip; word-break: break-word; }
th:nth-child(3), td:nth-child(3) { width: auto; }

th { background: var(--header-bg); white-space: nowrap; position: sticky; z-index: 10; background-clip: padding-box; }
tr[style*="background"] { background-color: var(--comment-bg) !important; color: var(--comment-text) !important; }
pre { background: var(--header-bg); padding: 15px; border-radius: 4px; border: 1px solid var(--border-color); overflow-x: auto; max-width: ${maxWidth}; margin: 0; font-family: monospace; font-size: 0.9rem; white-space: pre-wrap; word-break: break-all; }

.view-panel { display: none; }
#panelTable { display: block; }

.col-aliases { display: table-cell; }
body.hide-aliases .col-aliases { display: none; }
body.hide-aliases tr[style*="background"] td { grid-column: span 2; }

@media (max-width: 600px) {
  body { padding: 0 10px 10px 10px; }
  .sticky-header { padding: 15px 0 10px 0; }
  .header-container { flex-direction: column; align-items: flex-start; gap: 8px; }
  .header-right { width: 100%; justify-content: space-between; } 
  th, td { padding: 6px 8px; font-size: 0.85rem; }
}
</style>
</head>
<body>
<div class="sticky-header" id="stickyHeader">
  <div class="header-container">
    <h2 id="pageHeading">🤖 ${pageName} for !cmd</h2>
    <div class="header-right">
      <span class="timestamp">Last Refreshed: ${dateStr}</span>
      ${!isSimpleRoute ? '<button class="btn active" id="btnAliases" onclick="toggleAliases()">🏷️ Aliases: Show</button>' : ''}
      <button class="btn active" id="btnTable" onclick="handleTableButtonClick()">${!isSimpleRoute ? '📋 Table: Expanded' : '📋 Table'}</button>
      <button class="btn" id="btnJson" onclick="switchView('json')">📦 JSON</button>
      <button class="btn" id="btnRaw" onclick="switchView('raw')">📄 Raw</button>
      <button class="btn" onclick="toggleTheme()">🌓 Theme</button>
    </div>
  </div>
</div>

<div id="panelTable" class="view-panel">
  <table>
    <thead>
      <tr><th>${col1}</th>${col2 ? `<th class="col-aliases">${col2}</th>` : ""}${col3 ? `<th>${col3}</th>` : ""}</tr>
    </thead>
    <tbody>
      ${tableRowsHtml}
    </tbody>
  </table>
</div>

<div id="panelJson" class="view-panel">
  <pre>${escapeHtml(jsonFormattedText)}</pre>
</div>

<div id="panelRaw" class="view-panel">
  <pre>${escapeHtml(rawText)}</pre>
</div>

<script>
function updateStickyHeaderOffset() {
  const header = document.getElementById('stickyHeader');
  const thElements = document.querySelectorAll('#panelTable th');
  if (header && thElements.length > 0) {
    const headerHeight = header.offsetHeight;
    thElements.forEach(th => {
      th.style.top = (headerHeight - 1) + 'px';
    });
  }
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('theme_preference', theme);
}

function toggleTheme() {
  const current = localStorage.getItem('theme_preference') || 'light';
  setTheme(current === 'light' ? 'dark' : 'light');
  requestAnimationFrame(updateStickyHeaderOffset);
}

${!isSimpleRoute ? `
function toggleAliases() {
  const currentShow = localStorage.getItem('show_aliases') === null ? true : localStorage.getItem('show_aliases') === 'true';
  const newState = !currentShow;
  localStorage.setItem('show_aliases', newState);
  updateAliasesUI(newState);
}

function updateAliasesUI(show) {
  const btn = document.getElementById('btnAliases');
  if (btn) {
    btn.textContent = '🏷️ Aliases: ' + (show ? 'Show' : 'Hide');
    btn.classList.toggle('active', show);
  }
  document.body.classList.toggle('show-aliases', show);
  document.body.classList.toggle('hide-aliases', !show);

  const commentRows = document.querySelectorAll('tr[style*="background"] td');
  commentRows.forEach(td => {
    td.setAttribute('colspan', show ? '3' : '2');
  });
  requestAnimationFrame(updateStickyHeaderOffset);
}

function updateTableUI(isExpanded) {
  const btn = document.getElementById('btnTable');
  if (btn) {
    btn.textContent = '📋 Table: ' + (isExpanded ? 'Expanded' : 'Simple');
  }
  const rows = document.querySelectorAll('#panelTable tbody tr[data-expanded]');
  rows.forEach(tr => {
    const targetCell = tr.lastElementChild;
    if (targetCell) {
      targetCell.innerHTML = isExpanded ? tr.getAttribute('data-expanded') : tr.getAttribute('data-short');
    }
  });
  requestAnimationFrame(updateStickyHeaderOffset);
}

function handleTableButtonClick() {
  const currentView = localStorage.getItem('preferred_view');
  if (currentView === 'table') {
    const currentExpandedPref = localStorage.getItem('expanded_view');
    const isExpanded = currentExpandedPref === null ? true : currentExpandedPref === 'true';
    const newState = !isExpanded;
    localStorage.setItem('expanded_view', newState);
    updateTableUI(newState);
  } else {
    switchView('table');
  }
}
` : ''}

function switchView(viewName) {
  ['table', 'json', 'raw'].forEach(v => {
    const panel = document.getElementById('panel' + v.charAt(0).toUpperCase() + v.slice(1));
    const btn = document.getElementById('btn' + v.charAt(0).toUpperCase() + v.slice(1));
    if (panel) panel.classList.toggle('active', v === viewName);
    if (btn) btn.classList.toggle('active', v === viewName);
  });

  if (viewName === 'table' && !${isSimpleRoute}) {
    const currentExpandedPref = localStorage.getItem('expanded_view');
    const isExpanded = currentExpandedPref === null ? true : currentExpandedPref === 'true';
    updateTableUI(isExpanded);
  }

  localStorage.setItem('preferred_view', viewName);
  requestAnimationFrame(updateStickyHeaderOffset);
}

window.addEventListener('load', updateStickyHeaderOffset);
window.addEventListener('resize', updateStickyHeaderOffset);

window.addEventListener('DOMContentLoaded', () => {
  if (!${isSimpleRoute}) {
    const savedShowAliases = localStorage.getItem('show_aliases');
    const showAliases = savedShowAliases === null ? true : savedShowAliases === 'true';
    updateAliasesUI(showAliases);

    const currentExpandedPref = localStorage.getItem('expanded_view');
    const savedExpanded = currentExpandedPref === null ? true : currentExpandedPref === 'true';
    updateTableUI(savedExpanded);
  }

  const savedView = localStorage.getItem('preferred_view') || 'table';
  switchView(savedView);
  requestAnimationFrame(updateStickyHeaderOffset);
});
</script>
</body>
</html>
